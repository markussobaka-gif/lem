<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменяем кириллицу на латиницу по клику</title>
    <link rel="stylesheet" href="passport.css">
</head>
<body>

<h1>Изменяем кириллицу на латиницу по клику</h1>

<!-- ==================== ПАСПОРТ ==================== -->
<div class="passport">
    <div class="photo"></div>
    <div class="passport__title">ПАСПОРТ</div>

    <p><span class="label">Фамилия: </span><b id="surname">Артамонова</b></p>
    <p><span class="label">Имя: </span><b id="name">Ксения</b></p>
    <p><span class="label">Отчество: </span><b id="patronymic">Юрьевна</b></p>
    <p><span class="label">Пол: </span><b>Женский</b></p>
    <p><span class="label">Дата рождения: </span><b>12.10.<i id="year">2007</i></b></p>
    <p><span class="label">Место рождения: </span><b id="city">г. Москва</b></p>
</div>

<!-- ==================== КНОПКИ ==================== -->
<div class="buttons">
    <button class="btn" onclick="toLatin()">Перевести на латиницу</button>
    <button class="btn btn--reset" onclick="toCyrillic()">Вернуть кириллицу</button>
</div>


<script>
    /* Таблица транслитерации: русская буква → латиница */
    var map = {
        'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e',
        'ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m',
        'н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u',
        'ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch',
        'ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',
        'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Е':'E','Ё':'E',
        'Ж':'Zh','З':'Z','И':'I','Й':'Y','К':'K','Л':'L','М':'M',
        'Н':'N','О':'O','П':'P','Р':'R','С':'S','Т':'T','У':'U',
        'Ф':'F','Х':'Kh','Ц':'Ts','Ч':'Ch','Ш':'Sh','Щ':'Shch',
        'Ъ':'','Ы':'Y','Ь':'','Э':'E','Ю':'Yu','Я':'Ya'
    };

    
    var original = {
        surname:    document.getElementById('surname').innerText,
        name:       document.getElementById('name').innerText,
        patronymic: document.getElementById('patronymic').innerText,
        year:       document.getElementById('year').innerText,
        city:       document.getElementById('city').innerText
    };

    /* Функция транслитерации одного текста */
    function translit(text) {
        var result = '';
        for (var i = 0; i < text.length; i++) {
            var ch = text[i];
            result += (map[ch] !== undefined) ? map[ch] : ch;
        }
        return result;
    }


    function toLatin() {
        document.getElementById('surname').innerText    = translit(original.surname);
        document.getElementById('name').innerText       = translit(original.name);
        document.getElementById('patronymic').innerText = translit(original.patronymic);
        document.getElementById('year').innerText       = translit(original.year);
        document.getElementById('city').innerText       = translit(original.city);
    }

    /*вернуть кириллицу */
    function toCyrillic() {
        document.getElementById('surname').innerText    = original.surname;
        document.getElementById('name').innerText       = original.name;
        document.getElementById('patronymic').innerText = original.patronymic;
        document.getElementById('year').innerText       = original.year;
        document.getElementById('city').innerText       = original.city;
    }
</script>

</body>
</html>
