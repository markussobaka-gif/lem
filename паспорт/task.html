<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Артамонова Ксения">
    <title>Решение алгоритмической задачи — Станислав Лем</title>
</head>
<body>


<main>
    <h1>Решение алгоритмической задачи</h1>

    <div class="task">

        
        <div class="task__condition">
            <strong>Условие задачи:</strong><br>
            Дано вещественное число. Определить, какое это число:
            положительное, отрицательное или ноль.
        </div>

    
        <form id="taskForm" method="POST" action="https://httpbin.org/post">

            <label for="x">Введите вещественное число x:</label>
            <input type="number" id="x" name="x" step="any" required
                placeholder="Например: -3.14">

            
            <input type="hidden" name="formulation"
                value="Дано вещественное число. Определить, какое это число: положительное, отрицательное, ноль.">
            <input type="hidden" id="resultField" name="result" value="не вычислено">

            <button type="submit">Определить и отправить</button>
        </form>

        <!-- ============ РЕЗУЛЬТАТ НА СТРАНИЦЕ ============ -->
        <div class="result" id="resultBox" style="display:none;">
            <strong>Результат решения:</strong><br>
            <span id="out">—</span>
        </div>

    </div>
</main>

<footer>
    <hr>
    <p>&copy; 2026, Артамонова Ксения</p>
</footer>

<script>
    document.getElementById('taskForm').addEventListener('submit', function (event) {
        event.preventDefault();

        var x = parseFloat(document.getElementById('x').value);
        var text;

        if (isNaN(x)) {
            text = 'Ошибка: введено не число.';
        } else if (x > 0) {
            text = 'Число ' + x + ' — положительное.';
        } else if (x < 0) {
            text = 'Число ' + x + ' — отрицательное.';
        } else {
            text = 'Число ' + x + ' — это ноль.';
        }

        document.getElementById('out').innerText = text;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resultField').value = text;

        event.target.submit();   
    });
</script>

</body>
</html>
